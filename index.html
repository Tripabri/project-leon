<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Leon</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 760px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 48px 32px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.5);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 4vw, 4rem);
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 0 auto 24px;
        max-width: 600px;
      }

      .tag {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.4);
        color: var(--accent);
        font-weight: bold;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Project Leon</h1>
      <p>
        This page is ready to be published with GitHub Pages. Upload it to the repository root
        and enable GitHub Pages in the repository settings.
      </p>
      <div class="tag">GitHub Pages Ready</div>
    </main>
  </body>
</html>
